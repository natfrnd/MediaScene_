<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Media Scene — Creative Archive</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="homepage">

        <div class="hero-container">

            <!-- BUTTON (outline) -->
            <button class="scene-button" id="sceneButton">
                <span class="scene-label">Portfolio</span>
            </button>

            <!-- MAIN HEADLINE -->
            <h1 class="main-title" aria-label="Media Scene">

                <span class="changing-word" id="changingWord">
                    <span class="word-inner" id="wordInner"></span>
                </span>

                <span class="static-word" id="staticWord"></span>

            </h1>

            <!-- INSTAGRAM CREDIT -->
            <a
                href="https://www.instagram.com/natfrdnd/"
                target="_blank"
                rel="noopener noreferrer"
                class="instagram-credit"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="15"
                    height="15"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <rect x="3" y="3" width="18" height="18" rx="5"/>
                    <circle cx="12" cy="12" r="4"/>
                    <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"/>
                </svg>

                <span>by @natfrdnd</span>
            </a>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
